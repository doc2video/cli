# Releases the doc2video package when a version tag (v1.2.3) is pushed:
#   1. publishes it to npm with trusted publishing (no npm token or security-key prompt;
#      the package gets a provenance badge linking it to this repo and run), then
#   2. publishes server.json to the official MCP Registry (GitHub OIDC login).
# Each step is skipped if that version is already published, so the workflow can be re-run
# (or started by hand from the Actions tab) to finish a release that stopped part-way.
#
# One-time setup on npmjs.com: package doc2video → Settings → Trusted publisher →
# GitHub Actions: organization "doc2video", repository "cli", workflow "release.yml",
# environment "npm", and tick "Allow npm publish".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance, and the MCP Registry login

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest

      - name: Versions agree
        run: |
          v="$(node -p "require('./package.json').version")"
          s="$(node -p "require('./server.json').version")"
          p="$(node -p "require('./server.json').packages[0].version")"
          if { [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; } || [ "$s" != "$v" ] || [ "$p" != "$v" ]; then
            echo "Versions disagree: ref $GITHUB_REF_NAME, package.json $v, server.json $s / $p"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "PACKAGE=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"
          echo "SERVER=$(node -p "require('./server.json').name")" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm test

      - name: Publish to npm
        run: |
          if npm view "$PACKAGE@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already on npm"
          else
            npm publish --provenance --access public
          fi

      # The MCP Registry checks npm for the version, which can take a minute to appear
      - name: Wait until npm shows the version
        run: |
          for i in $(seq 1 30); do
            npm view "$PACKAGE@$VERSION" version --prefer-online >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "npm still doesn't show $PACKAGE@$VERSION"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          listed="$(curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=$SERVER" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.servers||[]).some(x=>(x.server||x).name===process.env.SERVER&&(x.server||x).version===process.env.VERSION)?"yes":"no")}catch{console.log("no")}})')"
          if [ "$listed" = "yes" ]; then
            echo "$SERVER $VERSION is already in the MCP Registry"
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
